<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Triangle -->
  <polygon points="50,0 0,86.6 100,86.6" fill="black" />
  
  <!-- Clip half the circle -->
  <defs>
    <clipPath id="upperHalf">
      <!-- Rectangle covering only the upper half -->
      <rect x="0" y="58.86" width="100" height="27.74" />
    </clipPath>
  </defs>
  
  <!-- Circle with clipping applied -->
  <circle cx="50" cy="86.6" r="27.74" fill="lime" clip-path="url(#upperHalf)" />
</svg>